name: Bug report
description: Installation, metrics, RGB or USB display
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Plugin and Unraid versions
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Cooler model and detected profile (e.g. LF12)
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior and expected result
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove addresses, tokens, server names and private paths before sharing.
      render: text
