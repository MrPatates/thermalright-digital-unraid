name: Release en brouillon
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Vérifier le tag
        shell: bash
        run: |
          version=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
          fi
      - name: Construire et vérifier les fichiers de release
        env:
          CONTAINER_ENGINE: docker
        run: bash scripts/build.sh
      - name: Préparer le brouillon GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v$version"
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == true ]]
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Thermalright Digital $version" --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$tag" dist/release/* --clobber
      - name: Conserver les résultats
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-validation
          path: .build/logs/
          include-hidden-files: true
          retention-days: 14
